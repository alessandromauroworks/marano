<title>i Marano Parrucchieri</title>
<meta name="color-scheme" content="light">
<style>
:root{
  --text:#1d1d1f; --ink:#1d1d1f; --muted:#86868b; --muted2:#a1a1a6;
  --line:#e8e8ed; --line2:#d9d9de; --soft:#f5f5f7; --soft2:#fafafa; --act:#f0f0f2;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;text-decoration:none;color:var(--text)}
.mono{width:34px;height:34px;border-radius:9px;background:#1d1d1f;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13.5px;letter-spacing:.4px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.2px;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 11px;border-radius:7px;color:#3a3a3c;text-decoration:none;font-size:14.5px;position:relative;transition:background .15s}
.nav a svg{color:#6e6e73}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--act);font-weight:600;color:#000}
.nav a.on svg{color:#1d1d1f}
.nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;background:#1d1d1f;border-radius:2px}
.nav .badge{margin-left:auto;background:#1d1d1f;color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;transition:transform .2s}
.nav .badge.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.25)}}
.side .user{margin-top:auto;border-top:1px solid var(--line);padding:12px 16px 10px}
.side .urow{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#e8e8ed;color:#1d1d1f;font-weight:600;font-size:12.5px;display:grid;place-items:center;flex:none}
.user .nm{font-weight:600;font-size:14px;line-height:1.15}.user .rl{color:var(--muted);font-size:12.5px}
.user .demo{color:var(--muted2);font-size:11.5px;margin-top:9px;letter-spacing:.2px}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);z-index:20;border-bottom:1px solid transparent}
.burger{display:none;padding:6px;border-radius:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:8px;height:34px;padding:0 12px;width:320px;max-width:100%;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:14.5px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.status{margin-left:auto;display:flex;align-items:center;gap:9px;color:#424245;font-size:13.5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#34c759;display:inline-block;flex:none}
#view{padding:8px 26px 56px;min-width:0}
.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* common */
.ph{display:flex;align-items:baseline;gap:12px;margin:8px 0 16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px}
.ph span{color:var(--muted);font-size:15px}
.ph .act{margin-left:auto;display:flex;gap:8px;align-self:center}
.bar{background:#1d1d1f;color:#fff;text-transform:uppercase;letter-spacing:1.4px;font-weight:600;font-size:12px;min-height:34px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:7px 7px 0 0;padding:0 14px;text-align:center}
.bar:has(.r){padding:0 104px}.bar.sm:has(.r){padding:0 40px}
.bar .r{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.3px;text-transform:none;font-weight:500;color:#d2d2d7}
.bar .r button{color:#fff;display:flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;padding:4px 6px;border-radius:5px}
.bar .r button:hover{background:rgba(255,255,255,.12)}
.bar .l{position:absolute;left:12px;top:0;bottom:0;display:flex;align-items:center;font-size:12px;letter-spacing:.3px;text-transform:none;font-weight:500;color:#d2d2d7}
.box{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:#fff}
.box.pad{padding:14px 16px}
.sec{margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:18px;overflow:hidden}
.kpi{padding:13px 18px 15px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .l{color:var(--muted);font-size:13.5px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--muted);font-size:13px;margin-top:1px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{font-weight:500;color:var(--muted);text-align:left;font-size:13px;padding:10px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid #f0f0f3;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.srow{transition:background .15s}
tr.srow:hover td{background:#fafafc}
tr.click{cursor:pointer}
tr.sel td{background:#f2f2f5!important}
.b{font-weight:600}.mut{color:var(--muted)}.right{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
button.pill{cursor:pointer;transition:filter .15s}button.pill:hover{filter:brightness(.96)}
.p-ok{background:#e4f5e8;color:#1e7b34}
.p-wait{background:#fdf0dc;color:#b25e09}
.p-bad{background:#fde6e5;color:#c4302b}
.p-info{background:#e5effb;color:#2a62a8}
.p-grey{background:#f0f0f2;color:#5e5e63}
.p-dark{background:#1d1d1f;color:#fff}
.ns{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b30;margin-left:6px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;font-weight:600;font-size:13.5px;transition:filter .15s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(.94)}
.btn-dark{background:#1d1d1f;color:#fff}
.btn-line{border:1px solid var(--line2);background:#fff}
.btn-line:hover{background:var(--soft);filter:none}
.btn-red{background:#ff3b30;color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.seg{display:inline-flex;gap:2px;background:var(--soft);border-radius:8px;padding:3px}
.seg button{height:28px;padding:0 14px;border-radius:6px;color:#6e6e73;font-size:13.5px;font-weight:500}
.seg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.flt{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.flt button{height:30px;padding:0 12px;border-radius:7px;font-weight:500;font-size:13.5px;color:#3a3a3c}
.flt button i{font-style:normal;color:var(--muted);margin-left:5px;font-size:12.5px}
.flt button.on{background:#1d1d1f;color:#fff}.flt button.on i{color:#c7c7cc}
.flt button:not(.on):hover{background:var(--soft)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sp{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.side2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side2>*,.two>*{min-width:0}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.bars .hb{display:grid;grid-template-columns:170px 1fr 54px;gap:12px;align-items:center;padding:8px 16px;font-size:14px}
.bars .hb div{height:8px;background:#f0f0f2;border-radius:4px;overflow:hidden}
.bars .hb div i{display:block;height:100%;background:#1d1d1f;border-radius:4px;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bars .hb b{text-align:right;font-variant-numeric:tabular-nums}
.prog{display:inline-flex;align-items:center;gap:8px}
.prog i{display:block;width:110px;height:6px;background:#ececf0;border-radius:3px;overflow:hidden}
.prog i u{display:block;height:100%;background:#1d1d1f;text-decoration:none;border-radius:3px;transition:width .4s ease}
.prog.warn i u{background:#e08a1e}

/* toast / modal / menu / drawer */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1d1d1f;color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .22s ease;z-index:120;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{color:#30d158}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:90;animation:ovin .18s ease;padding:16px}
@keyframes ovin{from{opacity:0}}
.modal{background:#fff;border-radius:14px;width:min(500px,100%);box-shadow:0 24px 70px rgba(0,0,0,.25);animation:mup .22s ease;max-height:calc(100vh - 32px);overflow:auto}
@keyframes mup{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal h3{margin:0;font-size:17px;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;letter-spacing:-.2px}
.modal h3 button{margin-left:auto;color:var(--muted);padding:4px;border-radius:6px}
.modal h3 button:hover{background:var(--soft)}
.modal .mb{padding:16px 20px;display:grid;gap:12px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{display:grid;gap:5px}.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{height:36px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;outline:0;font:inherit;font-size:14px;width:100%;min-width:0}
.fld textarea{height:auto;padding:9px 10px;line-height:1.5;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#86868b;box-shadow:0 0 0 3px #ececf0}
.fld input.err,.fld select.err{border-color:#ff3b30}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.merr{background:#fde6e5;color:#c4302b;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.45}
.mhint{background:var(--soft);border-radius:8px;padding:9px 12px;font-size:13px;color:#424245;line-height:1.45}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.14);padding:5px;z-index:80;min-width:180px;animation:mup .15s ease}
.menu .mh{font-size:11.5px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.menu button{display:flex;width:100%;padding:8px 10px;border-radius:6px;gap:8px;align-items:center;font-size:13.5px;text-align:left}
.menu button:hover{background:var(--soft)}
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:70;animation:ovin .2s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:71;box-shadow:-20px 0 50px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:din .24s cubic-bezier(.2,.8,.2,1)}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dh .avatar{width:42px;height:42px;font-size:15px}
.drawer .dh b{font-size:17px;display:block;letter-spacing:-.2px}.drawer .dh span{color:var(--muted);font-size:13px}
.drawer .dh button{margin-left:auto;color:var(--muted);padding:6px;border-radius:6px}
.drawer .db{flex:1;overflow:auto;padding:16px 20px 30px}
.dsec{margin-bottom:18px}
.dsec h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kvg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kvg span{display:block;color:var(--muted);font-size:12.5px}.kvg b{font-size:14.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f0f0f3;font-size:13.5px}
.hist div:first-child{border-top:0}
.tog{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px;border-top:1px solid #f0f0f3}
.tog:first-child{border-top:0}
.sw{width:40px;height:24px;border-radius:12px;background:#e5e5ea;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(16px)}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#3a3a3c}
.nextap{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.nextap .d{width:46px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.nextap .d small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.nextap .d b{font-size:20px}

/* panoramica */
.today td{padding:10px 14px}
.today tr:first-child td{border-top:0}
.today .t{font-weight:600;width:64px}
.todo{padding:4px 0}
.todo label{display:flex;gap:11px;align-items:flex-start;padding:9px 16px;cursor:pointer;font-size:14px;transition:background .15s;line-height:1.4}
.todo label:hover{background:#fafafc}
.todo input{display:none}
.todo .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid #c7c7cc;display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s;color:#fff}
.todo .cb svg{opacity:0;width:12px;height:12px;stroke-width:2.6}
.todo input:checked+.cb{background:#1d1d1f;border-color:#1d1d1f}
.todo input:checked+.cb svg{opacity:1}
.todo input:checked~span{color:var(--muted2);text-decoration:line-through}
.todo span small{display:block;color:var(--muted);font-size:12.5px}
.call{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #f0f0f3;font-size:14px}
.call:first-child{border-top:0}
.call .tx{flex:1;min-width:0}.call .tx b{display:block}.call .tx span{color:var(--muted);font-size:12.5px}

/* agenda */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#6e6e73;margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid;display:inline-block}
.datenav{display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px}
.datenav button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#3a3a3c}
.datenav button:hover{background:var(--soft)}
.datenav button[disabled]{opacity:.3;pointer-events:none}
.datenav span{min-width:178px;text-align:center}
.agwrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff;max-height:calc(100vh - 230px);min-height:420px}
.ag{display:grid;grid-template-columns:58px repeat(4,minmax(170px,1fr));min-width:740px;position:relative}
.ag .hd{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px;font-size:14px}
.ag .hd .avatar{width:28px;height:28px;font-size:11.5px}
.ag .hd b{display:block;line-height:1.15}.ag .hd small{color:var(--muted);font-size:12px}
.ag .hd.c0{left:0;z-index:7}
.times{position:relative;border-right:1px solid var(--line);background:#fff;position:sticky;left:0;z-index:5}
.times div{position:absolute;right:8px;font-size:11.5px;color:var(--muted);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid #f0f0f3;background-image:linear-gradient(#f0f0f3 1px,transparent 1px);background-size:100% 42px}
.col:nth-child(2){border-left:0}
.col.over{background-color:#fafafc}
.blk{position:absolute;left:4px;right:4px;border-radius:7px;border:1px solid;overflow:hidden;font-size:12px;line-height:1.25;user-select:none;transition:box-shadow .15s,transform .15s,opacity .15s;cursor:grab;z-index:2}
.blk:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);z-index:4}
.blk.drag{opacity:.4}
.blk .lab{position:relative;z-index:2;padding:4px 8px}
.blk .lab b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .lab span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.blk .seg2{position:absolute;left:0;right:0;z-index:1}
.blk .posa{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 6px,rgba(255,255,255,.25) 6px 12px);border-top:1px dashed currentColor;border-bottom:1px dashed currentColor;display:flex;align-items:flex-end;justify-content:flex-start;padding:3px 8px;font-size:11px;font-weight:600;opacity:.95}
.blk.inposa{left:50%;right:4px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.blk.done{opacity:.55}
.blk .st{position:absolute;right:6px;top:5px;z-index:3;width:8px;height:8px;border-radius:50%}
.blk .st.ns{background:#ff3b30;margin:0}
.c-tp{background:#e8f0fb;border-color:#bcd0ec;color:#24466f}
.c-col{background:#f2eaf7;border-color:#d8c3e6;color:#55306a}

let tT;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=ic('checkc')+'<span>'+msg+'</span>';t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800);}
async function saveFile(name,data,okMsg){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data});toast(okMsg||('Scaricato · '+name))}catch(e){const c=e&&e.code;toast(c==='declined'?'Download annullato':c==='rate_limited'?'Attendi un attimo e riprova':'Download non disponibile qui')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();toast(okMsg||('Scaricato · '+name))}catch(e){toast('Download non disponibile qui')}
}
function csv(name,rows){
  const s=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  saveFile(name,new Blob(['﻿'+s],{type:'text/csv;charset=utf-8'}),'CSV scaricato · '+name);
}
function modal(title,body,actions){

}

function popMenu(anchor,head,items,onPick){

}

const dayAppts=(d,op)=>APPTS.filter(a=>a.d===d&&(!op||a.op===op));
const posaWin=a=>{const ph=SVC[a.svc].ph;return ph?[a.s+ph[0],a.s+ph[0]+ph[1]]:null;};
function hostOf(a){ // appuntamento dentro la posa di un altro
  return dayAppts(a.d,a.op).find(x=>x!==a&&posaWin(x)&&a.s>=posaWin(x)[0]&&a.s+a.dur<=posaWin(x)[1]);
}
const brkMsg=(op,x)=>x.lab==='Chiuso'?`il sabato il salone chiude alle ${m2t(x.s)}`:x.dur>=120?`${op} è in pausa dalle ${m2t(x.s)} · riapre alle ${m2t(x.s+x.dur)}`:`${op} è in pausa dalle ${m2t(x.s)} alle ${m2t(x.s+x.dur)}`;
function conflict(d,op,s,dur,exId,svc){
  const others=dayAppts(d,op).filter(x=>x.id!==exId);
  if(s<OPEN||s+dur>CLOSE)return {msg:'fuori dall’orario di apertura (9:00–20:30)'};
  const me=SVC[svc||((APPTS.find(z=>z.id===exId)||{}).svc)||''];
  const myW=me&&me.ph?[s+me.ph[0],s+me.ph[0]+me.ph[1]]:null;
  for(const x of others){
    if(!(s<x.s+x.dur&&x.s<s+dur))continue;
    if(x.svc==='pausa')return {x,msg:brkMsg(op,x)};
    const w=posaWin(x);
    if(w&&s>=w[0]&&s+dur<=w[1]){
      const busy=others.find(y=>y!==x&&y.s>=w[0]&&y.s+y.dur<=w[1]&&s<y.s+y.dur&&y.s<s+dur);
      if(!busy)continue;
    }
    if(myW&&x.s>=myW[0]&&x.s+x.dur<=myW[1])continue;
    return {x,msg:`${op} è occupato alle ${m2t(x.s)} con ${x.cl}`};
  }
  return null;
}
function freeGaps(d,op,from){
  const busy=dayAppts(d,op).filter(a=>!hostOf(a)).map(a=>[a.s,a.s+a.dur]).sort((a,b)=>a[0]-b[0]);
  const g=[];let t=Math.max(OPEN,from||OPEN);
  busy.forEach(([s,e])=>{if(s-t>=30)g.push([t,s]);t=Math.max(t,e);});
  if(CLOSE-t>=30)g.push([t,CLOSE]);
  return g;
}

 document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const r=REQS.find(x=>x.id===+b.dataset.pr);const dur=SVC[r.svc].dur;

  [{label:'Annulla'},{label:'Invia proposta',cls:'btn-dark',fn:ov=>{const o=opts[+ov.querySelector('#prS').value];r.st='prop';r.prop=`${dayLab(o[0])} ${m2t(o[2])} · ${o[1]}`;setBadge();setTimeout(()=>{render(false);toast(`Proposta inviata a ${r.n}: ${r.prop}`);},0);}}]);});

function approveReq(id){
 const r=REQS.find(x=>x.id===id);if(!r||r.st!=='wait')return;const dur=SVC[r.svc].dur;
 let op=r.op;
 if(conflict(r.d,op,r.s,dur,-1,r.svc)){const alt=OPS.map(o=>o.n).find(n=>!conflict(r.d,n,r.s,dur,-1,r.svc));
  if(!alt){toast(`Orario non più libero: proponi un altro orario a ${r.n}`);return;}op=alt;}
 const a=A(r.d,op,m2t(r.s),r.svc,r.n,'prenotata');if(r.dep)a.dep=r.dep;APPTS.push(a);
 if(!findCl(r.n))CL.push(Object.assign(C(r.n,r.d,0,SVC[r.svc].p,op,0,0,1,0,'Prima prenotazione dalla pagina online.'),{tel:'—',isNew:true}));
 r.st='ok';r.op=op;r.fresh=false;setBadge();render(false);
 toast(`Approvata · ${r.n} entra in agenda ${reqWhen(r)} con ${op}`);
}
INCOMING.forEach(q=>setTimeout(()=>{const r=Object.assign({},q,{fresh:true});delete r.delay;REQS.unshift(r);setBadge(true);toast(`Nuova richiesta online · ${r.n} · ${SVC[r.svc].n}`);
 if(cur==='online')render(false);
},q.delay));

 ${L.map(c=>{const st=clState(c);const w=Math.floor(daysBetween(c.last,TODAY)/7);return `<tr class="srow click ${clSel===c.n?'sel':''}" data-cl="${esc(c.n)}"><td><span class="b">${esc(c.n)}</span>${c.kid?' <span class="pill p-grey" style="height:20px;font-size:11.5px;margin-left:4px">bambino</span>':''}${c.ns?'<span class="ns" title="No-show in passato"></span>':''}</td><td class="mut">${c.tel}</td><td>${fmtDate(c.last)} <span class="mut">${daysBetween(c.last,TODAY)>0?(w>0?'· '+w+' sett. fa':'· questa settimana'):'· oggi'}</span></td><td>${c.fq?'ogni '+c.fq+' sett.':'—'}</td><td class="right">${eur(c.sp)}</td><td>${c.pref}</td><td>${c.vis}</td><td><span class="pill ${CLST[st][0]}">${CLST[st][1]}</span></td></tr>`;}).join('')}
 </tbody></table></div></div>
 <div class="small-note">«Da richiamare»: clienti che non tornano da più di 5 settimane e non hanno appuntamenti. Li chiami tu e li segni come richiamati.</div>`;

function history(c){
 const typ=c.kid?['bimbo']:c.bia?['bianchi','uomo','tb']:c.sp>=22?['tb','tb','uomo']:c.sp<=10?['barba']:c.sp<=12?['sfum','uomo']:['uomo','uomo','tb'];
 const out=[];const base=new Date(c.last+'T12:00:00');
 for(let i=0;i<Math.min(5,Math.max(1,c.vis));i++){const d=new Date(base);d.setDate(d.getDate()-i*7*Math.max(1,c.fq||3));const sv=SVC[typ[i%typ.length]];out.push([d.toISOString().slice(0,10),sv.n,c.pref,sv.p]);}
 return out;
}

  <div class="dsec"><div class="kvg"><div><span>Ultima visita</span><b>${fmtDate(c.last)}</b></div><div><span>Frequenza media</span><b>${c.fq?'ogni '+c.fq+' settimane':'—'}</b></div><div><span>Spesa media</span><b>${eur(c.sp)}</b></div><div><span>Barbiere</span><b>${c.pref}</b></div><div><span>No-show</span><b>${c.ns?c.ns+(c.ns===1?' volta':' volte'):'mai'}</b></div><div><span>Stato</span><b>${CLST[st][1]}</b></div></div></div>

  <div class="dsec"><h4>Note</h4><div class="note" contenteditable="true" id="cNote" style="outline:0;min-height:40px">${esc(c.nota||'Nessuna nota.')}</div></div>

 </div>`;
 document.body.appendChild(ov);document.body.appendChild(dr);
 ov.onclick=closeDrawer;dr.querySelector('[data-dx]').onclick=closeDrawer;

V.abbonamenti=()=>{
 const ren=PACKS.filter(p=>p.tot-p.u<=2&&p.u<p.tot);
 const L=PACKS.filter(p=>packFilter==='tutti'||(packFilter==='rinnovo'?p.tot-p.u<=2:p.tot-p.u>2));
 return `${head('Abbonamenti','Pacchetti prepagati e sedute rimaste · prezzi d\'esempio',`<button class="btn btn-dark" id="newP">${ic('plus',15)} Nuovo abbonamento</button>`)}
 ${kpis([['Abbonamenti attivi',PACKS.filter(p=>p.u<p.tot).length,'tagli, taglio + barba, barbe'],['Sedute prepagate',PACKS.reduce((s,p)=>s+p.tot-p.u,0),'ancora da usare'],['Rinnovo da proporre',ren.length,'mancano 2 sedute o meno'],['Venduti a ottobre',eur(270),'3 pacchetti']])}
 <div class="toolbar"><div class="flt">${[['tutti','Tutti'],['rinnovo','Rinnovo da proporre'],['attivi','Con molte sedute']].map(f=>`<button class="${packFilter===f[0]?'on':''}" data-pf="${f[0]}">${f[1]}</button>`).join('')}</div></div>
 <div class="sec"><div class="bar">Pacchetti · ${L.length}</div><div class="box tbl-wrap"><table><thead><tr><th>Cliente</th><th>Pacchetto</th><th>Sedute usate</th><th>Valido fino al</th><th class="right">Pagato</th><th>Stato</th><th></th></tr></thead><tbody>
 ${L.map(p=>{const i=PACKS.indexOf(p),left=p.tot-p.u;return `<tr class="srow"><td class="b">${esc(p.cl)}</td><td>${p.k}</td><td><span class="prog ${left<=2?'warn':''}"><i><u style="width:${p.u/p.tot*100}%"></u></i>${p.u}/${p.tot}</span></td><td>${fmtDate(p.to)}</td><td class="right">${eur(p.pr)}</td><td>${left===0?'<span class="pill p-bad">Esaurito</span>':left<=2?`<span class="pill p-wait">Rinnovo da proporre · ${left} ${left===1?'rimasta':'rimaste'}</span>`:'<span class="pill p-ok">Attivo</span>'}</td><td class="right"><button class="btn btn-line sm" data-use="${i}" ${left===0?'disabled style="opacity:.4"':''}>+ Seduta</button> <button class="btn ${left<=2?'btn-dark':'btn-line'} sm" data-ren="${i}">Rinnova</button></td></tr>`;}).join('')}
 </tbody></table></div></div>
 <div class="note">Pacchetti d'esempio: 6 tagli € 80 · 5 taglio + barba € 100 · 10 barbe € 90. Quando mancano 2 sedute compare «rinnovo da proporre»: lo proponi in cassa, a fine servizio.</div>`;
};

/* ---------- Spese ---------- */
V.spese=()=>{
 const ent=MOVES.filter(m=>m.a>0).reduce((s,m)=>s+m.a,0),usc=-MOVES.filter(m=>m.a<0).reduce((s,m)=>s+m.a,0);
 const due=MOVES.filter(m=>m.due);
 const M6=[['mag',9200,3450],['giu',9900,3520],['lug',10600,3610],['ago',6100,3180],['set',9400,3490],['ott',ent,usc]];const mx=11000;
 const cats={};MOVES.filter(m=>m.a<0).forEach(m=>cats[m.c]=(cats[m.c]||0)-m.a);
 return `${head('Spese','Entrate e uscite di ottobre',`<button class="btn btn-dark" id="newM">${ic('plus',15)} Nuovo movimento</button>`)}
 <div class="two sec">
  <div><div class="bar">Risultato di ottobre</div><div class="box"><div class="res"><div><span>Entrate</span><b>${eur(ent)}</b></div><div><span>Uscite</span><b>${eur(usc)}</b></div><div><span>Margine</span><b>${eur(ent-usc)}</b></div></div>
   <div class="chart">${M6.map((b,i)=>`<div class="c"><em>${b[0]}: entrate ${eur(b[1])} · uscite ${eur(b[2])}</em><div class="pair"><i class="e" data-h="${Math.round(b[1]/mx*100)}"></i><i class="u" data-h="${Math.round(b[2]/mx*100)}"></i></div><span>${b[0]}${i===5?' *':''}</span></div>`).join('')}</div>
   <div class="lg2"><span><i style="background:#1d1d1f"></i>Entrate</span><span><i style="background:#c7c7cc"></i>Uscite</span><span>* ottobre fino al 26</span></div></div></div>
  <div><div class="bar">Uscite per categoria · ottobre</div><div class="box bars" style="padding:8px 0">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hb srow"><span>${k}</span><div><i data-w="${Math.round(v/usc*100)}"></i></div><b>${eur(v)}</b></div>`).join('')}</div></div>
 </div>
 <div class="sec"><div class="bar">Movimenti · ottobre<span class="l">Da pagare ${eur(-due.reduce((s,m)=>s+m.a,0))} · ${due.length}</span><span class="r">${csvBtn('csvS')}</span></div><div class="box tbl-wrap"><table><thead><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th></th><th class="right">Importo</th></tr></thead><tbody>
 ${MOVES.map((m,i)=>`<tr class="srow"><td class="mut" style="width:70px">${m.d}</td><td>${esc(m.t)}</td><td><span class="pill p-grey">${m.c}</span></td><td>${m.due?`<button class="pill p-wait" data-pay="${i}">Da pagare</button>`:''}</td><td class="right b" style="${m.a>0?'color:#1e7b34':''}">${m.a>0?'+ ':''}${eur(m.a)}</td></tr>`).join('')}
 </tbody></table></div></div>
 <div class="small-note">Importi d'esempio.</div>`;
};
B.spese=()=>{
 requestAnimationFrame(()=>{document.querySelectorAll('.chart i').forEach(i=>i.style.height=i.dataset.h+'%');document.querySelectorAll('.bars i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%');});
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const m=MOVES[+b.dataset.pay];confirmBox('Segna come pagato',`Confermi il pagamento di <b>${eur(-m.a)}</b> · ${esc(m.t)}?`,'Segna pagato','btn-dark',()=>{m.due=0;render(false);toast('Pagamento registrato');});});
 document.getElementById('csvS').onclick=()=>csv('movimenti-marano-ottobre-2026.csv',[['Data','Descrizione','Categoria','Importo (€)','Stato']].concat(MOVES.map(m=>[m.d+' 2026',m.t,m.c,m.a,m.due?'da pagare':'pagato'])));
 document.getElementById('newM').onclick=()=>{modal('Nuovo movimento',`<div class="row2"><div class="fld"><label>Tipo</label><select id="mT"><option value="-1">Uscita</option><option value="1">Entrata</option></select></div><div class="fld"><label>Data</label><input id="mD" type="date" value="2026-10-27"></div></div>
  <div class="fld"><label>Descrizione</label><input id="mX" placeholder="es. Fattura lame e mantelle"></div>
  <div class="row2"><div class="fld"><label>Categoria</label><select id="mC">${['Fornitori','Affitto','Utenze','Personale','Servizi','Consulenze','Attrezzatura','Incassi'].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fld"><label>Importo (€)</label><input id="mA" type="number" min="0"></div></div>
  <label class="tog" style="border:0"><span>Ancora da pagare</span><button class="sw" type="button" id="mDue"></button></label>`,
  [{label:'Annulla'},{label:'Salva movimento',cls:'btn-dark',fn:ov=>{const x=ov.querySelector('#mX').value.trim(),a=+ov.querySelector('#mA').value;if(!x){ov.querySelector('#mX').classList.add('err');return false;}if(!(a>0)){ov.querySelector('#mA').classList.add('err');return false;}
   const dv=(ov.querySelector('#mD').value||'2026-10-27').split('-');const MM=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];MOVES.unshift({d:(+dv[2])+' '+MM[(+dv[1]||10)-1],t:x,c:ov.querySelector('#mC').value,a:a*(+ov.querySelector('#mT').value),due:ov.querySelector('#mDue').classList.contains('on')?1:0});
   setTimeout(()=>{render(false);toast('Movimento registrato');},0);}}]);
  const md=document.getElementById('mDue');md.onclick=()=>md.classList.toggle('on');};
};

 </div>
 <div class="sec"><div class="bar">Resa per barbiere · ottobre<span class="r">${csvBtn('csvRep')}</span></div><div class="box tbl-wrap"><table><thead><tr><th>Barbiere</th><th class="right">Incassato</th><th class="right">Ore lavorate</th><th class="right">Incasso all'ora</th><th class="right">Ticket medio</th><th>Ritorno clienti</th></tr></thead><tbody>
 ${RESB.map(r=>`<tr class="srow"><td class="b">${r[0]}</td><td class="right b">${eur(r[1])}</td><td class="right">${r[2]} h</td><td class="right">${eur(r[1]/r[2])}</td><td class="right">${eur2(r[3])}</td><td><span class="prog"><i><u style="width:${r[4]}%"></u></i>${r[4]}%</span></td></tr>`).join('')}
 </tbody></table></div></div>`;

B.report=()=>{
 requestAnimationFrame(()=>document.querySelectorAll('.bars i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'));
 document.getElementById('csvRep').onclick=()=>{const rows=[['Barbiere','Incassato (€)','Ore','Incasso orario (€)','Ticket medio (€)','Ritorno (%)']].concat(RESB.map(r=>[r[0],r[1],r[2],Math.round(r[1]/r[2]),r[3].toFixed(2).replace('.',','),r[4]]));rows.push([]);rows.push(['Servizio','Quantità ottobre']);TOPS.forEach(t=>rows.push(t));csv('report-marano-ottobre-2026.csv',rows);};

let cur=null,inShell=false;
function route(){
 let r=(location.hash||'').slice(1);
 if(!V[r])r=store.get('marano-route')||'panoramica';if(!V[r])r='panoramica';
 if(!inShell){shell();inShell=true;setBadge();}
 const changed=cur!==r;cur=r;store.set('marano-route',r);closeDrawer();closeMenu();
 if(location.hash.slice(1)!==r)history_replace(r);
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
 render(true);if(changed)window.scrollTo(0,0);
}
function history_replace(r){try{window.history.replaceState(null,'','#'+r);}catch(e){}}
function render(anim){
 const v=document.getElementById('view');if(!v)return;
 const aw=document.getElementById('agwrap');const keep=aw?[aw.scrollTop,aw.scrollLeft]:null;
 v.innerHTML=V[cur]();
 if(anim){v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade');}
 const aw2=document.getElementById('agwrap');if(aw2&&keep&&!anim){aw2.scrollTop=keep[0];aw2.scrollLeft=keep[1];aw2.dataset.s=1;}
 B[cur]&&B[cur]();applySearch();
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('qov')){closeRevQr();return;}closeModal();closeMenu();closeDrawer();}});
route();

})();
